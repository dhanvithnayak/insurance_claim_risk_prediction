name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check app.py tests/

  test:
    name: Automated Regression Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Execute Pytest Test Suite
        run: pytest -v

  docker-smoke-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t auto-insurance-claim-api:${{ github.sha }} .

      - name: Run Container & Verify Health
        run: |
          docker run -d -p 8000:8000 --name api-smoke-test auto-insurance-claim-api:${{ github.sha }}
          sleep 5
          # Health probe check
          curl --fail http://localhost:8000/health
          # Web UI check
          curl --fail http://localhost:8000/
          # Prediction inference test
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "age": 2,
              "gender": 1,
              "driving_experience": "20-29y",
              "education": "university",
              "income": "upper class",
              "credit_score": 0.629,
              "vehicle_ownership": 1.0,
              "vehicle_year": "after 2015",
              "married": 1.0,
              "children": 1.0,
              "postal_code": 10238,
              "annual_mileage": 12000.0,
              "vehicle_type": "sedan",
              "speeding_violations": 0,
              "duis": 0,
              "past_accidents": 0
            }'
          docker rm -f api-smoke-test
